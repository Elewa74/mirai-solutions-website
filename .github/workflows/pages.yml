# Publishes a static export of the site to GitHub Pages on every push to main.
# Preview URL: https://<user>.github.io/<repo>/  — once a custom domain is set in Settings → Pages,
# configure-pages reports an empty base path and the same workflow publishes at the domain root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test "tests/*.test.mjs"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Export static site
        run: node scripts/export-static.mjs
        env:
          NODE_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://miraisolutions.net
          # Visitor-facing WhatsApp hand-off is switched OFF (owner's decision, Sep 2026): the number must not appear
          # on the site. To re-enable, restore the line below (repository variable MIRAI_WHATSAPP, international digits).
          # MIRAI_WHATSAPP: ${{ vars.MIRAI_WHATSAPP }}
          # Optional email relay for the static site: a FormSubmit AJAX endpoint (https://formsubmit.co/ajax/<address>)
          # and extra recipients (comma-separated). Success is shown only when the relay confirms delivery.
          MIRAI_FORM_ENDPOINT: ${{ vars.MIRAI_FORM_ENDPOINT }}
          MIRAI_FORM_CC: ${{ vars.MIRAI_FORM_CC }}
          # Optional owner WhatsApp notification (CallMeBot URL with a {text} placeholder), fired after a confirmed send
          MIRAI_NOTIFY_URL: ${{ vars.MIRAI_NOTIFY_URL }}
          # Optional cookie-free visitor analytics: Cloudflare Web Analytics site token (32 hex chars)
          MIRAI_CF_BEACON_TOKEN: ${{ vars.MIRAI_CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
